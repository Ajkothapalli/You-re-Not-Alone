name: Daily Stories

# Keeps the feed fed. push-daily-stories generates fresh confessions per
# category each day, every one through the same moderation + crisis gate as a
# real submission, and they recede automatically as real confessions arrive
# (recommend-confessions ranks source='user' above generated).
#
# Why here and not pg_cron: the in-database schedule
# (20260706000001_lang_matching.sql) is wrapped in
#   IF EXISTS (pg_cron) AND EXISTS (pg_net) ... EXCEPTION WHEN OTHERS THEN NULL
# so it schedules nothing at all when those extensions are off, silently, and
# it needs app.project_ref / app.service_role_key set on the database by hand.
# Running it here means the schedule is in version control, every run is
# visible in the Actions tab with logs, and it can be triggered manually.
#
# Volume is controlled in the database, not here:
#   UPDATE seed_config SET per_category = 5 WHERE id = 1;   -- 7 categories x 5
#   UPDATE seed_config SET enabled = false WHERE id = 1;    -- stop instantly
on:
  schedule:
    # 03:30 UTC = 09:00 IST. GitHub's scheduler can lag under load; the
    # function is idempotent per day per category (seed_runs), so a late or
    # double fire is harmless.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which project to seed'
        type: choice
        options: [production, development, both]
        default: production

jobs:
  seed:
    name: Generate daily confessions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # One request per category. All seven in a single invocation exceeded
      # Supabase's per-invocation compute (546 WORKER_RESOURCE_LIMIT) once
      # generation moved to gpt-4o, with moderation, crisis check and embedding
      # run per confession.
      CATEGORIES: mental_health relationships grief secrets work_identity body_health faith_meaning
      KEY: ${{ secrets.SEED_CRON_SECRET }}

    steps:
      - name: Seed production
        if: github.event_name == 'schedule' || inputs.target == 'production' || inputs.target == 'both'
        env:
          # Public by design — this ships in the client bundle. It exists only
          # to satisfy the gateway's JWT check; x-seed-secret is the real auth.
          ANON: sb_publishable_qHe9n5MLT_MxQHZsDizUEQ_gCdgYfvM
          REF: sjywjerlqxwfniwqjojs
        run: |
          fail=0
          for c in $CATEGORIES; do
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 300 -X POST \
              "https://$REF.supabase.co/functions/v1/push-daily-stories" \
              -H "Authorization: Bearer $ANON" \
              -H "x-seed-secret: $KEY" \
              -H "Content-Type: application/json" \
              -d "{\"category\":\"$c\"}")
            # Counts only — the function never returns confession text.
            echo "$c -> HTTP $code $(cat /tmp/out.json)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then fail=1; fi
          done
          # One bad category shouldn't hide the other six — report at the end.
          exit $fail

      - name: Seed development
        if: inputs.target == 'development' || inputs.target == 'both'
        env:
          ANON: sb_publishable_XPLP2lcoe2DJmnilIa4-Jw_X-yz8oBp
          REF: tmpqadweifuwbmktbmzg
        run: |
          fail=0
          for c in $CATEGORIES; do
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 300 -X POST \
              "https://$REF.supabase.co/functions/v1/push-daily-stories" \
              -H "Authorization: Bearer $ANON" \
              -H "x-seed-secret: $KEY" \
              -H "Content-Type: application/json" \
              -d "{\"category\":\"$c\"}")
            echo "$c -> HTTP $code $(cat /tmp/out.json)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then fail=1; fi
          done
          exit $fail
