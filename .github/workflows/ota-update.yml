name: OTA Update

on:
  push:
    branches: [main]
    paths-ignore:
      # Changes to these always require a native rebuild — skip OTA
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/android-icon-*.png'
      - 'assets/icon.png'
      - 'assets/splash-*.png'
      - '.github/workflows/**'
      - 'supabase/**'

jobs:
  update:
    name: Push EAS Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push OTA update to production channel
        run: |
          npx eas-cli update \
            --branch production \
            --message "OTA: ${{ github.event.head_commit.message }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
