name: Android Preview Build

# Installable APK for on-device testing. Sideload this directly — an AAB
# cannot be installed on a device, it is only a Play upload format.
#
# Builds LOCALLY on the runner (eas build --local), not via EAS cloud, so it
# does not consume the monthly EAS build quota — the same approach
# android-production.yml uses.
#
# Backend: the `preview` profile points at the DEVELOPMENT Supabase project.
# Same code and same Edge Functions as production, different database — so
# test submissions do not land in the production data.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # eas-cli 24+ requires Node >=22.
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK (local — preview profile)
        env:
          # Expo's prebuild template ships -Xmx2048m -XX:MaxMetaspaceSize=512m
          # and /android is gitignored, so the runner regenerates it and a local
          # gradle.properties never reaches CI. At those defaults the daemon
          # exhausts Metaspace mid-build and the job hangs silently until the
          # timeout. Quoted so the whole value stays one token.
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g"'
        run: |
          eas build --local \
            --platform android \
            --profile preview \
            --non-interactive \
            --output ${{ github.workspace }}/soulyap-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soulyap-apk-${{ github.run_number }}
          path: ${{ github.workspace }}/soulyap-preview.apk
          retention-days: 30
