name: Android Preview Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install dependencies
        run: npm ci

      - name: Build APK via EAS cloud
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Run EAS cloud build and capture output; tee so we see logs live
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json 2>&1 | tee eas-output.txt

          # Extract the artifact URL from EAS JSON output line
          ARTIFACT_URL=$(grep -o '"artifactUrl":"[^"]*"' eas-output.txt | tail -1 | cut -d'"' -f4)
          if [ -z "$ARTIFACT_URL" ]; then
            # Try alternate key name
            ARTIFACT_URL=$(grep -o '"url":"[^"]*\.apk[^"]*"' eas-output.txt | tail -1 | cut -d'"' -f4)
          fi
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT
          echo "APK URL: $ARTIFACT_URL"

      - name: Download APK
        if: steps.eas_build.outputs.artifact_url != ''
        run: |
          curl -L "${{ steps.eas_build.outputs.artifact_url }}" -o app-preview.apk
          ls -lh app-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-${{ github.run_number }}
          path: app-preview.apk
          retention-days: 14
