name: Android Production AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB (production)
    runs-on: ubuntu-latest
    # A previous run hung and was cancelled at 6h. Bounded so a hang costs
    # minutes rather than a day of Actions time. 120 not 90: this builds all
    # four ABIs (armeabi-v7a, arm64-v8a, x86, x86_64) and the Reanimated 4
    # worklets C++ compile is slow on a 2-core runner. If it ever needs to be
    # faster, dropping the x86 ABIs is the lever — they are emulator and
    # Chromebook only, so that is a device-support decision, not a CI tweak.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # eas-cli 24+ requires Node >=22 (@oclif/plugin-autocomplete engine
          # constraint). On Node 20 the CLI install fails outright, before the
          # build reaches any app code. android-preview.yml already runs 22.
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # versionCode is NOT auto-incremented. eas.json sets appVersionSource:
      # "local", so the number comes from app.json and nothing here changes it
      # — every build of a given commit produces the same versionCode, and Play
      # refuses a second upload of one it has seen ("Version code N has already
      # been used"). Bump app.json's expo.android.versionCode and commit it
      # before each upload.
      #
      # Adding autoIncrement to the production profile would NOT fix this while
      # appVersionSource is "local": it rewrites app.json on the build machine,
      # and CI checkouts are thrown away, so every run would compute the same
      # committed value + 1. The real fix is appVersionSource: "remote" with
      # autoIncrement, letting EAS hold the counter server-side — worth doing,
      # but verify it against `eas build --local` before relying on it.
      - name: Build AAB (local — production profile)
        env:
          # Expo's prebuild template ships -Xmx2048m -XX:MaxMetaspaceSize=512m,
          # and /android is gitignored — the runner regenerates it, so a local
          # gradle.properties never reaches CI. At those defaults the daemon
          # exhausts Metaspace partway through the native builds and dies with
          # OutOfMemoryError: Metaspace; the job then sits silent until the
          # timeout rather than reporting a failure. Quoted so the whole value
          # stays one token — unquoted, Gradle splits on the space and only
          # -Xmx survives, leaving Metaspace back at the default.
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g"'
        run: |
          eas build --local \
            --platform android \
            --profile production \
            --non-interactive \
            --output ${{ github.workspace }}/app-production.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-production-${{ github.run_number }}
          path: ${{ github.workspace }}/app-production.aab
          retention-days: 30
